name: CI

# Economia de minutos do GitHub Actions (repositorio privado: Windows conta 2x, macOS 10x).
# Roda nos PRs (nao de novo no merge) e sob demanda; macOS fica de fora (o app e para Windows).
on:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Instalar FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Instalar FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Instalar o pacote
        run: python -m pip install -e ".[dev,gui]"
      - name: Lint
        run: ruff check src tests
      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  powershell:
    name: Sintaxe dos scripts PowerShell
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, 'ps1')
    steps:
      - uses: actions/checkout@v4
      - name: Analisar todos os .ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $falhou = $false
          Get-ChildItem -Filter *.ps1 -Recurse | ForEach-Object {
            $erros = $null; $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$erros)
            if ($erros) { $falhou = $true; $erros | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          if ($falhou) { exit 1 }
