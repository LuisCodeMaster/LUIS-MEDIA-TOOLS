name: Instalador Windows

# Gera o LUIS-MEDIA-TOOLS-Setup-<versao>.exe.
# - Em todo PR que mexe no empacotamento: gera e guarda como artefato (para testar).
# - Ao criar uma tag v* (ex.: v1.0.0): gera e publica numa Release do GitHub.
# - Manual: aba Actions > "Instalador Windows" > Run workflow.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
      - "src/luismedia/gui/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-exe:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de build
        run: python -m pip install --upgrade pip pyinstaller -e ".[whisper,gui]"

      - name: Versao
        id: v
        run: |
          $v = python -c "import luismedia; print(luismedia.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versao: $v"

      - name: Baixar FFmpeg (build essentials do gyan.dev, com libass)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo GyanD/codexffmpeg --pattern "*-essentials_build.zip" --dir ffmpeg-dl
          Expand-Archive (Get-ChildItem ffmpeg-dl\*.zip | Select-Object -First 1).FullName -DestinationPath ffmpeg-dl
          $bin = (Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          "FFMPEG_BIN=$bin" >> $env:GITHUB_ENV
          & "$bin\ffmpeg.exe" -hide_banner -version | Select-Object -First 1

      - name: Empacotar o app (PyInstaller)
        working-directory: packaging
        run: python -m PyInstaller --noconfirm --clean --distpath ..\dist app.spec

      - name: Embutir o FFmpeg
        run: |
          $dest = "dist\LUIS MEDIA TOOLS\bin"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$env:FFMPEG_BIN\ffmpeg.exe", "$env:FFMPEG_BIN\ffprobe.exe" $dest
          $lic = Get-ChildItem ffmpeg-dl -Recurse -Filter LICENSE* | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName "$dest\FFMPEG-LICENSE.txt" }

      - name: Autoteste do executavel
        run: |
          $env:LUISMEDIA_SELFTEST_LOG = "$PWD\selftest.log"
          $env:PATH = "C:\Windows\System32;C:\Windows"   # garante que usa o FFmpeg embutido
          $p = Start-Process -FilePath "dist\LUIS MEDIA TOOLS\LUIS MEDIA TOOLS.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path selftest.log) { Get-Content selftest.log }
          if ($p.ExitCode -ne 0) { throw "autoteste falhou (codigo $($p.ExitCode))" }

      - name: Compilar o instalador (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.v.outputs.version }}" "/DSourceDir=$PWD\dist\LUIS MEDIA TOOLS" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falhou" }
          Get-ChildItem dist\*.exe | ForEach-Object { "{0}  {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Guardar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: LUIS-MEDIA-TOOLS-Setup-${{ steps.v.outputs.version }}
          path: dist/LUIS-MEDIA-TOOLS-Setup-*.exe
          retention-days: 30

      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LUIS-MEDIA-TOOLS-Setup-*.exe
          generate_release_notes: true
