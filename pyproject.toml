[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "luismedia"
version = "1.0.1"
description = "LUIS MEDIA TOOLS - pos-producao de aulas com IA local: autocut, legendas, apostila, quiz e cortes 9:16"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
luismedia = "luismedia.cli:main"

[project.gui-scripts]
luismedia-app = "luismedia.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/luismedia"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: precisa do ffmpeg instalado"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
